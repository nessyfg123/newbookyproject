<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BookVault - Personal Book Collection</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans">

  <!-- Header / Navbar -->
  <header class="border-b border-slate-800 bg-slate-900/80 backdrop-blur sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="bg-indigo-600 p-2.5 rounded-xl text-white shadow-lg shadow-indigo-500/20">
          <i class="fa-solid fa-book-bookmark text-xl"></i>
        </div>
        <div>
          <h1 class="text-xl font-bold tracking-tight bg-gradient-to-r from-white to-slate-400 bg-clip-text text-transparent">BookVault</h1>
          <p class="text-xs text-slate-400">Open Library Collector</p>
        </div>
      </div>
      
      <!-- Stats Badges -->
      <div class="flex gap-4 text-sm font-medium">
        <div class="bg-slate-800/80 px-3 py-1.5 rounded-lg border border-slate-700/50">
          <span class="text-slate-400">Total Books:</span>
          <span id="stat-total" class="ml-1 text-indigo-400 font-bold">0</span>
        </div>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 py-8 grid grid-cols-1 lg:grid-cols-12 gap-8">
    
    <!-- Left Column: Search -->
    <section class="lg:col-span-5 space-y-4">
      <div class="bg-slate-800/50 border border-slate-700/60 rounded-2xl p-5 shadow-xl">
        <h2 class="text-lg font-semibold mb-3 flex items-center gap-2">
          <i class="fa-solid fa-magnifying-glass text-indigo-400"></i>
          Search Book Database
        </h2>
        
        <form id="search-form" class="flex gap-2 mb-4">
          <input 
            type="text" 
            id="search-input" 
            placeholder="Search title, author, or ISBN..." 
            class="w-full bg-slate-900/90 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-slate-100 focus:outline-none focus:border-indigo-500 transition"
            required
          />
          <button type="submit" class="bg-indigo-600 hover:bg-indigo-500 px-4 py-2.5 rounded-xl font-medium text-sm transition flex items-center gap-2 text-white">
            <span>Search</span>
          </button>
        </form>

        <!-- Search Status / Results Container -->
        <div id="search-status" class="text-sm text-slate-400 hidden mb-3">Searching library database...</div>
        
        <div id="search-results" class="space-y-3 max-h-[600px] overflow-y-auto pr-1">
          <div class="text-center py-12 text-slate-500 text-sm">
            Search for books above to query the database.
          </div>
        </div>
      </div>
    </section>

    <!-- Right Column: User's Shelf Collection -->
    <section class="lg:col-span-7 space-y-4">
      <div class="bg-slate-800/50 border border-slate-700/60 rounded-2xl p-5 shadow-xl min-h-[400px]">
        <div class="flex items-center justify-between mb-6">
          <h2 class="text-lg font-semibold flex items-center gap-2">
            <i class="fa-solid fa-layer-group text-emerald-400"></i>
            My Collection
          </h2>
          <span class="text-xs bg-slate-700 text-slate-300 px-2.5 py-1 rounded-full" id="collection-count">0 Saved</span>
        </div>

        <!-- Shelf Display -->
        <div id="collection-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4">
          <!-- Dynamically populated from LocalStorage -->
        </div>

        <!-- Empty State -->
        <div id="empty-shelf" class="text-center py-16">
          <i class="fa-solid fa-books text-4xl text-slate-700 mb-3"></i>
          <p class="text-slate-400 text-sm">Your shelf is empty.</p>
          <p class="text-slate-500 text-xs mt-1">Search books on the left to add them to your collection.</p>
        </div>
      </div>
    </section>
  </main>

  <script>
    // App State stored in browser LocalStorage
    let userLibrary = JSON.parse(localStorage.getItem('bookvault_collection')) || [];

    // DOM Elements
    const searchForm = document.getElementById('search-form');
    const searchInput = document.getElementById('search-input');
    const searchResults = document.getElementById('search-results');
    const searchStatus = document.getElementById('search-status');
    const collectionGrid = document.getElementById('collection-grid');
    const emptyShelf = document.getElementById('empty-shelf');
    const statTotal = document.getElementById('stat-total');
    const collectionCount = document.getElementById('collection-count');

    // ==========================================
    // ENHANCED OPEN LIBRARY API FETCH FUNCTION
    // ==========================================
    async function searchBooksAPI(query) {
      if (!query.trim()) return [];

      const encodedQuery = encodeURIComponent(query.trim());
      const url = `https://openlibrary.org/search.json?q=${encodedQuery}&limit=15`;

      try {
        const response = await fetch(url);
        if (!response.ok) throw new Error(`HTTP Error: ${response.status}`);
        
        const data = await response.json();
        if (!data.docs) return [];

        return data.docs.map((item) => {
          const title = item.title || 'Unknown Title';
          const author = item.author_name ? item.author_name.join(', ') : 'Unknown Author';
          const year = item.first_publish_year ? item.first_publish_year.toString() : 'N/A';
          
          // 1. Extract ISBN (prioritizing ISBN-13, then ISBN-10)
          let isbn = 'N/A';
          if (item.isbn && Array.isArray(item.isbn) && item.isbn.length > 0) {
            const isbn13 = item.isbn.find(i => String(i).length === 13);
            const isbn10 = item.isbn.find(i => String(i).length === 10);
            isbn = isbn13 || isbn10 || item.isbn[0];
          }

          // 2. Resolve Cover Image (Cover ID first, ISBN as fallback)
          const coverId = item.cover_i;
          let coverUrl = 'https://via.placeholder.com/150x220?text=No+Cover';
          
          if (coverId) {
            coverUrl = `https://covers.openlibrary.org/b/id/${coverId}-M.jpg`;
          } else if (isbn !== 'N/A') {
            coverUrl = `https://covers.openlibrary.org/b/isbn/${isbn}-M.jpg`;
          }

          return {
            id: item.key || `${title}-${year}-${Math.random()}`,
            title: title,
            author: author,
            year: year,
            cover: coverUrl,
            isbn: isbn
          };
        });
      } catch (error) {
        console.error("Error connecting to Open Library API:", error);
        return null;
      }
    }

    // ==========================================
    // UI RENDER FUNCTIONS
    // ==========================================
    
    function renderSearchResults(books) {
      searchResults.innerHTML = '';

      if (books === null) {
        searchResults.innerHTML = `<div class="p-4 bg-red-900/20 border border-red-800 text-red-300 text-sm rounded-xl">Unable to fetch books right now. Check your network or try again.</div>`;
        return;
      }

      if (books.length === 0) {
        searchResults.innerHTML = `<div class="text-center py-8 text-slate-400 text-sm">No books found matching your query.</div>`;
        return;
      }

      books.forEach(book => {
        const isAlreadySaved = userLibrary.some(item => item.id === book.id);
        
        const card = document.createElement('div');
        card.className = "flex gap-3 bg-slate-900/60 p-3 rounded-xl border border-slate-700/50 hover:border-slate-600 transition items-center";
        
        card.innerHTML = `
          <img src="${book.cover}" alt="${book.title}" class="w-12 h-16 object-cover rounded-md bg-slate-800 flex-shrink-0" />
          <div class="flex-1 min-w-0">
            <h3 class="text-sm font-semibold text-slate-100 truncate">${book.title}</h3>
            <p class="text-xs text-slate-400 truncate">${book.author}</p>
            <p class="text-[10px] text-slate-500 mt-0.5">${book.year} • ISBN: ${book.isbn}</p>
          </div>
          <button 
            onclick='toggleCollectBook(${JSON.stringify(book).replace(/'/g, "&apos;")})'
            class="px-3 py-1.5 rounded-lg text-xs font-medium transition flex-shrink-0 ${
              isAlreadySaved 
                ? 'bg-emerald-950 text-emerald-400 border border-emerald-800 hover:bg-red-950 hover:text-red-400 hover:border-red-800' 
                : 'bg-indigo-600 hover:bg-indigo-500 text-white'
            }"
          >
            ${isAlreadySaved ? 'Saved' : 'Collect'}
          </button>
        `;
        searchResults.appendChild(card);
      });
    }

    function renderCollection() {
      collectionGrid.innerHTML = '';
      statTotal.textContent = userLibrary.length;
      collectionCount.textContent = `${userLibrary.length} Saved`;

      if (userLibrary.length === 0) {
        emptyShelf.classList.remove('hidden');
        collectionGrid.classList.add('hidden');
        return;
      }

      emptyShelf.classList.add('hidden');
      collectionGrid.classList.remove('hidden');

      userLibrary.forEach(book => {
        const card = document.createElement('div');
        card.className = "group relative bg-slate-900/80 border border-slate-700/50 rounded-xl overflow-hidden hover:border-indigo-500/50 transition flex flex-col";
        
        card.innerHTML = `
          <div class="aspect-[2/3] w-full bg-slate-800 relative overflow-hidden">
            <img src="${book.cover}" alt="${book.title}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300" />
            <button 
              onclick="removeBook('${book.id}')"
              class="absolute top-2 right-2 bg-slate-900/80 hover:bg-red-600 text-slate-300 hover:text-white p-1.5 rounded-full text-xs transition backdrop-blur opacity-0 group-hover:opacity-100"
              title="Remove book"
            >
              <i class="fa-solid fa-trash"></i>
            </button>
          </div>
          <div class="p-3 flex-1 flex flex-col justify-between">
            <div>
              <h4 class="text-xs font-bold text-slate-100 line-clamp-1">${book.title}</h4>
              <p class="text-[11px] text-slate-400 line-clamp-1 mt-0.5">${book.author}</p>
            </div>
            <div class="mt-2 text-[10px] text-indigo-400 font-medium">
              ${book.year}
            </div>
          </div>
        `;
        collectionGrid.appendChild(card);
      });
    }

    // ==========================================
    // ACTION HANDLERS
    // ==========================================
    
    function toggleCollectBook(book) {
      const index = userLibrary.findIndex(item => item.id === book.id);
      if (index >= 0) {
        userLibrary.splice(index, 1);
      } else {
        userLibrary.push(book);
      }
      saveAndSync();
    }

    function removeBook(bookId) {
      userLibrary = userLibrary.filter(b => b.id !== bookId);
      saveAndSync();
    }

    function saveAndSync() {
      localStorage.setItem('bookvault_collection', JSON.stringify(userLibrary));
      renderCollection();
      
      const currentQuery = searchInput.value.trim();
      if (currentQuery) {
        searchBooksAPI(currentQuery).then(renderSearchResults);
      }
    }

    searchForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const query = searchInput.value.trim();
      if (!query) return;

      searchStatus.classList.remove('hidden');
      searchResults.innerHTML = '';
      
      const books = await searchBooksAPI(query);
      
      searchStatus.classList.add('hidden');
      renderSearchResults(books);
    });

    renderCollection();
  </script>
</body>
</html>
